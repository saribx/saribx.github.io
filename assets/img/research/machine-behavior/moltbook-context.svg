<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-ctx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.55)" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#0b0b0e" />

  <!-- Stat tile: dataset -->
  <rect x="40" y="40" width="380" height="200" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5" />
  <text x="230" y="128" font-size="52" font-weight="700" fill="#f5f5f7" text-anchor="middle">44,411</text>
  <text x="230" y="166" font-size="15" fill="#e8e8ea" text-anchor="middle">public Moltbook posts across</text>
  <text x="230" y="186" font-size="15" fill="#e8e8ea" text-anchor="middle">12,209 submolts</text>
  <text x="230" y="218" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">Jiang et al., 2026</text>

  <!-- Stat tile: human confound -->
  <rect x="40" y="270" width="380" height="200" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.24)" stroke-width="1.5" />
  <text x="230" y="358" font-size="46" font-weight="700" fill="#f5f5f7" text-anchor="middle">17,000 : 1.5M</text>
  <text x="230" y="396" font-size="15" fill="#e8e8ea" text-anchor="middle">human operators behind registered</text>
  <text x="230" y="416" font-size="15" fill="#e8e8ea" text-anchor="middle">"agents", a confound by design</text>
  <text x="230" y="448" font-size="12" fill="rgba(255,255,255,0.45)" text-anchor="middle">Wiz Research, 2026</text>

  <!-- Evidence: looks human -->
  <rect x="460" y="40" width="330" height="250" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-dasharray="5 5" />
  <text x="482" y="70" font-size="15" font-weight="600" fill="#f5f5f7">Looks like human social media</text>
  <g font-size="13.5" fill="#e8e8ea">
    <circle cx="488" cy="108" r="3.5" fill="rgba(255,255,255,0.7)" />
    <text x="502" y="113">Heavy-tailed activity and attention,</text>
    <text x="502" y="132">just like human platforms</text>
    <circle cx="488" cy="168" r="3.5" fill="rgba(255,255,255,0.7)" />
    <text x="502" y="173">Attention concentrates in hubs,</text>
    <text x="502" y="192">polarizing platform-native narratives</text>
    <circle cx="488" cy="228" r="3.5" fill="rgba(255,255,255,0.7)" />
    <text x="502" y="233">Agents correct and object to risky</text>
    <text x="502" y="252">instructions posted by other agents</text>
  </g>

  <!-- Evidence: does not look human -->
  <rect x="830" y="40" width="330" height="250" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-dasharray="5 5" />
  <text x="852" y="70" font-size="15" font-weight="600" fill="#f5f5f7">Doesn't look human at all</text>
  <g font-size="13.5" fill="#e8e8ea">
    <circle cx="858" cy="108" r="3.5" fill="rgba(255,255,255,0.7)" />
    <text x="872" y="113">Reciprocity far lower than on</text>
    <text x="872" y="132">Reddit or Bluesky</text>
    <circle cx="858" cy="168" r="3.5" fill="rgba(255,255,255,0.7)" />
    <text x="872" y="173">Agents mostly broadcast instead</text>
    <text x="872" y="192">of replying to each other</text>
    <circle cx="858" cy="228" r="3.5" fill="rgba(255,255,255,0.7)" />
    <text x="872" y="233">No way to verify an "agent" isn't</text>
    <text x="872" y="252">just a human with a script</text>
  </g>

  <!-- Arrows into the open question -->
  <line x1="625" y1="292" x2="725" y2="355" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-ctx)" />
  <line x1="995" y1="292" x2="895" y2="355" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-ctx)" />

  <!-- Open question -->
  <rect x="540" y="360" width="540" height="110" rx="14" fill="rgba(255,255,255,0.075)" stroke="rgba(255,255,255,0.4)" stroke-width="1.8" />
  <text x="810" y="390" font-size="12" font-weight="600" letter-spacing="1.5" fill="rgba(255,255,255,0.55)" text-anchor="middle">OPEN QUESTION</text>
  <text x="810" y="420" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle">Surface mimicry of human social media,</text>
  <text x="810" y="444" font-size="17" font-weight="600" fill="#f5f5f7" text-anchor="middle">or real social structure with binding conventions?</text>
</svg>
