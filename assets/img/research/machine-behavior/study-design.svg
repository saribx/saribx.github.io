<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-sd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,0.55)" />
    </marker>
    <pattern id="hatch-sd" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#0b0b0e" />

  <!-- ============ PHASE I ============ -->
  <rect x="40" y="40" width="500" height="580" rx="16" fill="rgba(255,255,255,0.012)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="62" y="70" font-size="12" font-weight="600" letter-spacing="1.5" fill="rgba(255,255,255,0.55)">PHASE I</text>
  <text x="62" y="97" font-size="19" font-weight="600" fill="#f5f5f7">Field study on Moltbook</text>
  <text x="62" y="118" font-size="12" fill="rgba(255,255,255,0.5)">observational · 20 weekly windows · Feb to Jun 2026</text>

  <rect x="60" y="140" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="78" y="164" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">DATA</text>
  <text x="78" y="190" font-size="13.5" fill="#e8e8ea">Public 44k-post dataset (Jiang et al., 2026)</text>
  <text x="78" y="211" font-size="13.5" fill="#e8e8ea">+ own API collection, 50 most active submolts</text>

  <line x1="290" y1="232" x2="290" y2="249" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-sd)" />

  <rect x="60" y="252" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="78" y="276" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">FILTER HUMAN-OPERATED ACCOUNTS</text>
  <text x="78" y="302" font-size="13.5" fill="#e8e8ea">Template duplicates, human waking-hour rhythms,</text>
  <text x="78" y="323" font-size="13.5" fill="#e8e8ea">scripted bursts. Run with and without the filter.</text>

  <line x1="290" y1="344" x2="290" y2="361" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-sd)" />

  <rect x="60" y="364" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="78" y="388" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">MEASURES</text>
  <text x="78" y="414" font-size="13.5" fill="#e8e8ea">Sentence-BERT similarity within vs. between submolts</text>
  <text x="78" y="435" font-size="13.5" fill="#e8e8ea">Distance to rolling centroid · karma · PageRank</text>

  <line x1="290" y1="456" x2="290" y2="473" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-sd)" />

  <rect x="60" y="476" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="78" y="500" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">ANALYSIS</text>
  <text x="78" y="526" font-size="13.5" fill="#e8e8ea">Mixed-effects growth models (H1)</text>
  <text x="78" y="547" font-size="13.5" fill="#e8e8ea">Karma regression, lagged panel, Granger causality (H2)</text>

  <text x="290" y="600" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">tests H1 · H2</text>

  <!-- Bridge -->
  <line x1="545" y1="330" x2="652" y2="330" stroke="rgba(255,255,255,0.6)" stroke-width="2" marker-end="url(#arrow-sd)" />
  <text x="600" y="300" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="middle">isolates karma</text>
  <text x="600" y="315" font-size="11.5" fill="rgba(255,255,255,0.6)" text-anchor="middle">causally</text>

  <!-- ============ PHASE II ============ -->
  <rect x="660" y="40" width="500" height="580" rx="16" fill="rgba(255,255,255,0.012)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="682" y="70" font-size="12" font-weight="600" letter-spacing="1.5" fill="rgba(255,255,255,0.55)">PHASE II</text>
  <text x="682" y="97" font-size="19" font-weight="600" fill="#f5f5f7">Sandbox experiment</text>
  <text x="682" y="118" font-size="12" fill="rgba(255,255,255,0.5)">causal · agent-only · no human participants</text>

  <!-- Agents -->
  <rect x="680" y="140" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="698" y="164" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">30 OPENCLAW AGENTS · MOLTBOOK-LIKE FORUM</text>
  <g>
    <g fill="#f5f5f7">
      <circle cx="704" cy="182" r="4.5" /><circle cx="717" cy="182" r="4.5" /><circle cx="730" cy="182" r="4.5" /><circle cx="743" cy="182" r="4.5" /><circle cx="756" cy="182" r="4.5" />
      <circle cx="704" cy="195" r="4.5" /><circle cx="717" cy="195" r="4.5" /><circle cx="730" cy="195" r="4.5" /><circle cx="743" cy="195" r="4.5" /><circle cx="756" cy="195" r="4.5" />
    </g>
    <text x="698" y="219" font-size="12.5" fill="#e8e8ea">10 × OpenAI</text>
    <g fill="rgba(255,255,255,0.5)">
      <circle cx="854" cy="182" r="4.5" /><circle cx="867" cy="182" r="4.5" /><circle cx="880" cy="182" r="4.5" /><circle cx="893" cy="182" r="4.5" /><circle cx="906" cy="182" r="4.5" />
      <circle cx="854" cy="195" r="4.5" /><circle cx="867" cy="195" r="4.5" /><circle cx="880" cy="195" r="4.5" /><circle cx="893" cy="195" r="4.5" /><circle cx="906" cy="195" r="4.5" />
    </g>
    <text x="848" y="219" font-size="12.5" fill="#e8e8ea">10 × Anthropic</text>
    <g fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.3">
      <circle cx="1004" cy="182" r="4" /><circle cx="1017" cy="182" r="4" /><circle cx="1030" cy="182" r="4" /><circle cx="1043" cy="182" r="4" /><circle cx="1056" cy="182" r="4" />
      <circle cx="1004" cy="195" r="4" /><circle cx="1017" cy="195" r="4" /><circle cx="1030" cy="195" r="4" /><circle cx="1043" cy="195" r="4" /><circle cx="1056" cy="195" r="4" />
    </g>
    <text x="998" y="219" font-size="12.5" fill="#e8e8ea">10 × Llama (open)</text>
  </g>

  <line x1="910" y1="232" x2="910" y2="249" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-sd)" />

  <!-- Manipulation -->
  <rect x="680" y="252" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="698" y="276" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">MANIPULATION · KARMA WEIGHT IN THE SYSTEM PROMPT</text>
  <rect x="698" y="290" width="105" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.35)" />
  <text x="750" y="309" font-size="13" fill="#e8e8ea" text-anchor="middle">none</text>
  <rect x="813" y="290" width="105" height="28" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.45)" />
  <text x="865" y="309" font-size="13" fill="#f5f5f7" text-anchor="middle">moderate</text>
  <rect x="928" y="290" width="105" height="28" rx="14" fill="rgba(255,255,255,0.26)" stroke="rgba(255,255,255,0.6)" />
  <text x="980" y="309" font-size="13" font-weight="600" fill="#f5f5f7" text-anchor="middle">high</text>
  <text x="1045" y="309" font-size="13" fill="#e8e8ea">× 3 runs</text>
  <text x="698" y="334" font-size="11.5" fill="rgba(255,255,255,0.5)">how strongly each agent is told to chase social approval</text>

  <line x1="910" y1="344" x2="910" y2="361" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-sd)" />

  <!-- Timeline -->
  <rect x="680" y="364" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="698" y="388" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">500 INTERACTION ROUNDS</text>
  <rect x="698" y="400" width="336" height="24" rx="5" fill="rgba(255,255,255,0.18)" />
  <text x="866" y="417" font-size="12" font-weight="600" fill="#f5f5f7" text-anchor="middle">karma on</text>
  <rect x="1036" y="400" width="86" height="24" rx="5" fill="url(#hatch-sd)" stroke="rgba(255,255,255,0.35)" stroke-dasharray="3 3" />
  <text x="1079" y="417" font-size="12" font-weight="600" fill="#f5f5f7" text-anchor="middle">off</text>
  <g font-size="11" fill="rgba(255,255,255,0.5)">
    <text x="698" y="442">0</text>
    <text x="1035" y="442" text-anchor="middle">400</text>
    <text x="1122" y="442" text-anchor="end">500</text>
  </g>

  <line x1="910" y1="456" x2="910" y2="473" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" marker-end="url(#arrow-sd)" />

  <!-- Analysis -->
  <rect x="680" y="476" width="460" height="92" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" />
  <text x="698" y="500" font-size="11" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.5)">ANALYSIS</text>
  <text x="698" y="526" font-size="13.5" fill="#e8e8ea">Interrupted time series, convergence before vs.</text>
  <text x="698" y="547" font-size="13.5" fill="#e8e8ea">after karma removal, across conditions (H3)</text>

  <text x="910" y="600" font-size="12.5" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle">tests H1 · H2 · H3</text>
</svg>
