<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="400" fill="#0b0b0e" />

  <!-- Theory -->
  <rect x="40" y="40" width="360" height="230" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
  <circle cx="82" cy="88" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.45)" />
  <g stroke="#f5f5f7" stroke-width="1.6">
    <line x1="74" y1="95" x2="90" y2="95" /><line x1="74" y1="95" x2="82" y2="80" /><line x1="90" y1="95" x2="82" y2="80" />
  </g>
  <g fill="#f5f5f7"><circle cx="74" cy="95" r="3.5" /><circle cx="90" cy="95" r="3.5" /><circle cx="82" cy="80" r="3.5" /></g>
  <text x="120" y="95" font-size="18" font-weight="600" fill="#f5f5f7">Theory</text>
  <g font-size="13.5" fill="rgba(255,255,255,0.72)">
    <text x="62" y="148">One of the first mechanism-level tests</text>
    <text x="62" y="170">of norm emergence in a real agent</text>
    <text x="62" y="192">society, taking machine behavior from</text>
    <text x="62" y="214">the individual to the collective level.</text>
  </g>

  <!-- AI safety -->
  <rect x="420" y="40" width="360" height="230" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
  <circle cx="462" cy="88" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.45)" />
  <path d="M462,76 L472,80 L472,88 C472,94 467,98 462,100 C457,98 452,94 452,88 L452,80 Z" fill="none" stroke="#f5f5f7" stroke-width="1.8" stroke-linejoin="round" />
  <text x="500" y="95" font-size="18" font-weight="600" fill="#f5f5f7">AI safety</text>
  <g font-size="13.5" fill="rgba(255,255,255,0.72)">
    <text x="442" y="148">Quantifies whether reputational</text>
    <text x="442" y="170">feedback pushes agent populations</text>
    <text x="442" y="192">toward homogenized discourse, the</text>
    <text x="442" y="214">social path to model and knowledge</text>
    <text x="442" y="236">collapse.</text>
  </g>

  <!-- Design -->
  <rect x="800" y="40" width="360" height="230" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
  <circle cx="842" cy="88" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.45)" />
  <g stroke="#f5f5f7" stroke-width="1.6" stroke-linecap="round">
    <line x1="831" y1="82" x2="853" y2="82" /><line x1="831" y1="94" x2="853" y2="94" />
  </g>
  <g fill="#0b0b0e" stroke="#f5f5f7" stroke-width="1.6"><circle cx="837" cy="82" r="3.5" /><circle cx="847" cy="94" r="3.5" /></g>
  <text x="880" y="95" font-size="18" font-weight="600" fill="#f5f5f7">Design</text>
  <g font-size="13.5" fill="rgba(255,255,255,0.72)">
    <text x="822" y="148">Karma-weight thresholds and</text>
    <text x="822" y="170">convergence metrics as early-warning</text>
    <text x="822" y="192">signals for echo chambers in</text>
    <text x="822" y="214">multi-agent ecosystems.</text>
  </g>

  <!-- Null result -->
  <rect x="40" y="295" width="1120" height="68" rx="14" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-dasharray="5 5" />
  <text x="600" y="324" font-size="12" font-weight="600" letter-spacing="1.5" fill="rgba(255,255,255,0.55)" text-anchor="middle">AND IF NOTHING CONVERGES?</text>
  <text x="600" y="347" font-size="14.5" fill="#e8e8ea" text-anchor="middle">A null result is just as informative: Moltbook's sociality would be surface mimicry without functional norms.</text>
</svg>
